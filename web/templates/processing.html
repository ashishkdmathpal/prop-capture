<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Processing — PropCapture</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    .step { display:flex; align-items:center; gap:10px; padding:8px 0; color:#94a3b8; transition:all 0.3s; }
    .step.active { color:#1e293b; font-weight:600; }
    .step.done { color:#16a34a; }
    .step-icon { font-size:1.2rem; width:28px; text-align:center; }
    .step-detail { font-size:0.82rem; color:#64748b; margin-left:38px; min-height:1.2em; transition:all 0.3s; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <a href="/" class="logo">Prop<span>Capture</span></a>
    </div>
  </header>

  <main>
    <div class="processing-card">
      <div class="spinner"></div>

      <h2>Processing <span class="file-label">{{ pdf_name }}</span></h2>

      <div id="steps-container">
        <div class="step" id="step-1"><span class="step-icon" id="icon-1">⏳</span> Scanning all pages</div>
        <div class="step-detail" id="detail-1"></div>
        <div class="step" id="step-2"><span class="step-icon" id="icon-2">⏳</span> Classifying pages</div>
        <div class="step-detail" id="detail-2"></div>
        <div class="step" id="step-3"><span class="step-icon" id="icon-3">⏳</span> Extracting details</div>
        <div class="step-detail" id="detail-3"></div>
      </div>

      <div class="elapsed-counter" id="elapsed-display">
        Elapsed: <span id="elapsed-seconds">{{ elapsed }}</span>s
      </div>
      <p style="margin-top:12px; font-size:0.82rem; color:#94a3b8;">
        This usually takes less than a minute
      </p>
    </div>
  </main>

  <script>
    const jobId = "{{ job_id }}";
    let elapsed = {{ elapsed }};
    const elapsedSpan = document.getElementById('elapsed-seconds');

    const ticker = setInterval(() => {
      elapsed++;
      elapsedSpan.textContent = elapsed;
    }, 1000);

    function updateSteps(currentStep, detail) {
      for (let i = 1; i <= 3; i++) {
        const el = document.getElementById('step-' + i);
        const icon = document.getElementById('icon-' + i);
        const det = document.getElementById('detail-' + i);
        el.classList.remove('active', 'done');
        if (i < currentStep) {
          el.classList.add('done');
          icon.textContent = '✅';
          det.textContent = '';
        } else if (i === currentStep) {
          el.classList.add('active');
          icon.textContent = '⏳';
          det.textContent = detail || '';
        } else {
          icon.textContent = '⏳';
          det.textContent = '';
        }
      }
    }

    async function pollStatus() {
      try {
        const res = await fetch(`/api/status/${jobId}`);
        const data = await res.json();

        if (data.status === 'done') {
          clearInterval(ticker);
          updateSteps(4, '');
          window.location.href = `/results/${jobId}`;
          return;
        }
        if (data.status === 'error') {
          clearInterval(ticker);
          window.location.href = `/status/${jobId}`;
          return;
        }

        updateSteps(data.current_step || 1, data.current_detail || '');
      } catch (e) {}
      setTimeout(pollStatus, 1500);
    }

    setTimeout(pollStatus, 1000);
  </script>
</body>
</html>
